services:

  mongo:
    # the integration suite's own mongo-java-driver 3.9 cannot authenticate against mongo 8
    image: mongo:4.4
    restart: always
    networks:
      - nf-simulator-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: zXcVbN123!
      MONGO_INITDB_DATABASE: pnf_simulator
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express
    restart: always
    ports:
    - "8081:8081"
    networks:
      - nf-simulator-network
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:zXcVbN123!@mongo:27017/

  ves-client:
    image: onap/org.onap.integration.nfsimulator.vesclient
    ports:
      - "5000:5000"
    networks:
      - nf-simulator-network
    environment:
      USE_CERTIFICATE_FOR_AUTHORIZATION: "false"
    volumes:
      - ./logs:/var/log
      - ./templates:/app/templates
      - ./store:/app/store
      - ./src/main/resources/application.properties:/app/application.properties
    restart: on-failure
    depends_on:
      - mongo
      - mongo-express

networks:
  nf-simulator-network:
    name: nf-simulator-network
